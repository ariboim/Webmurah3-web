<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" height="36" width="36">
  <defs>
    <linearGradient id="icon-top-facet" x1="4" y1="2" x2="32" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="icon-right-facet" x1="18" y1="10" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="icon-left-facet" x1="4" y1="10" x2="18" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="icon-edge-stroke" x1="4" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="icon-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Isometric Facets -->
  <path d="M18 2L32 10L18 18L4 10Z" fill="url(#icon-top-facet)" />
  <path d="M18 18L32 10V26L18 34Z" fill="url(#icon-right-facet)" />
  <path d="M4 10L18 18V34L4 26Z" fill="url(#icon-left-facet)" />

  <!-- Outer Structural Hexagon Wireframe -->
  <path d="M18 2L32 10V26L18 34L4 26V10L18 2Z" stroke="url(#icon-edge-stroke)" stroke-width="1.25" stroke-linejoin="round" fill="none" opacity="0.95" />

  <!-- Inner Digital Circuit Lines -->
  <path d="M18 2V18M32 10L18 18M32 26L18 18M18 34V18M4 26L18 18M4 10L18 18" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />

  <!-- Secondary Hex Ring -->
  <path d="M18 9L25 13V21L18 25L11 21V13L18 9Z" stroke="#7dd3fc" stroke-width="0.9" fill="none" opacity="0.75" />

  <!-- Interconnected Network Nodes -->
  <circle cx="18" cy="2" r="1.75" fill="#bae6fd" />
  <circle cx="32" cy="10" r="1.75" fill="#7dd3fc" />
  <circle cx="32" cy="26" r="1.75" fill="#38bdf8" />
  <circle cx="18" cy="34" r="1.75" fill="#60a5fa" />
  <circle cx="4" cy="26" r="1.75" fill="#38bdf8" />
  <circle cx="4" cy="10" r="1.75" fill="#7dd3fc" />

  <!-- Central Glowing Core Node -->
  <circle cx="18" cy="18" r="2.75" fill="#ffffff" filter="url(#icon-neon-glow)" />
  <circle cx="18" cy="18" r="1.5" fill="#0284c7" />
</svg>
